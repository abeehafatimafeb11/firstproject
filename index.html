    .frame {
      width: 100%;
      max-width: min(720px, 100%);
      aspect-ratio: 1024 / 682;
      border-radius: calc(var(--radius) + 6px);
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow:
        var(--frame-outer-shadow),
        inset 0 1px 0 var(--inset-highlight);
      background: var(--frame-bg);
    }

    .frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
