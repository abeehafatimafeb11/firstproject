    (function () {

      try {

      if (t !== "light" && t !== "dark") {
        t = "dark";
      }
      document.documentElement.setAttribute("data-theme", t);

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      font-family: "DM Sans", system-ui, sans-serif;
      color: var(--text);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .page-center {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1rem, 4vw, 2rem);
    }

    .frame {
      width: 100%;
      max-width: min(720px, 100%);
      aspect-ratio: 1024 / 682;
      border-radius: calc(var(--radius) + 6px);
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow:
        var(--frame-outer-shadow),
        inset 0 1px 0 var(--inset-highlight);
      background: var(--frame-bg);
    }

    .hero-slider {
      position: relative;
    }

    .hero-slider .hero-slides {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .hero-slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      opacity: 0;
      transition: opacity 0.9s ease;
      pointer-events: none;
    }

    .hero-slide.is-active {
      opacity: 1;
      z-index: 1;
    }

    .hero-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2.75rem;
      height: 2.75rem;
      min-width: 44px;
      min-height: 44px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--nav-bg);
      backdrop-filter: blur(10px);
      color: var(--text);
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease, transform 0.15s ease;
    }

    .hero-arrow svg {
      width: 1.25rem;
      height: 1.25rem;
      flex-shrink: 0;
    }

    .hero-arrow:hover {
      background: var(--nav-link-hover-bg);
      color: var(--text);
    }

    .hero-arrow:active {
      transform: translateY(-50%) scale(0.96);
    }

    .hero-arrow:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .hero-arrow-prev {
      left: clamp(0.5rem, 2vw, 0.85rem);
    }

    .hero-arrow-next {
      right: clamp(0.5rem, 2vw, 0.85rem);
    }

    @media (prefers-reduced-motion: reduce) {
      .hero-slide {
        transition-duration: 0.01ms;
      }

      .hero-arrow {
        transition-duration: 0.01ms;
      }

      .hero-arrow:active {
        transform: translateY(-50%);
      }
    }
  </style>
</head>
<body>
  <div id="site-nav-root"></div>
  <script src="site-nav.js"></script>

  <div class="page-center">

        <img

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">

      <button
        type="button"

        id="hero-carousel-next"
        aria-controls="hero-carousel-slides"
        aria-label="Next illustration"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">

        </svg>

  <script>
    (function () {
      var slides = document.querySelectorAll(".hero-slide");
      var prevBtn = document.getElementById("hero-carousel-prev");
      var nextBtn = document.getElementById("hero-carousel-next");
      if (!slides.length) return;

      var autoplayMs = 5000;
      var reducedMotion =
        typeof window.matchMedia === "function" &&
        window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var timerId = null;

      var index = 0;

      function setActive(nextIndex) {
        slides.forEach(function (img, j) {
          var on = j === nextIndex;
          img.classList.toggle("is-active", on);
          img.setAttribute("aria-hidden", on ? "false" : "true");
        });
      }

      function applyIndex(nextIndex) {
        index = nextIndex;
        setActive(index);
      }

      function goNext() {
        applyIndex((index + 1) % slides.length);
      }

      function goPrev() {
        applyIndex((index - 1 + slides.length) % slides.length);
      }

      function restartAutoplay() {
        if (reducedMotion) return;
        if (timerId !== null) {
          window.clearInterval(timerId);
        }
        timerId = window.setInterval(goNext, autoplayMs);
      }

      function onManualNav(goForward) {
        if (goForward) {
          goNext();
        } else {
          goPrev();
        }
        restartAutoplay();
      }

      if (prevBtn) {
        prevBtn.addEventListener("click", function () {
          onManualNav(false);
        });
      }
      if (nextBtn) {
        nextBtn.addEventListener("click", function () {
          onManualNav(true);
        });
      }

      setActive(0);
      restartAutoplay();
    })();
  </script>
  <script src="theme.js"></script>
  <script src="clocks.js"></script>
